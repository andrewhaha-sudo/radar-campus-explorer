name: RADAR facilities checks
on: [push, pull_request]
jobs:
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/pathfinder/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:pathfinder
      - run: npm test
      - run: npm run build
      - run: npm --prefix apps/pathfinder exec -- playwright install --with-deps chromium
      - run: npm run test:e2e:pathfinder
        env:
          PLAYWRIGHT_SOFTWARE_WEBGL: '1'
          CLOUDFLARE_SEND_METRICS: 'false'
