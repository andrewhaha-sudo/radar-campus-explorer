<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- MapLibre GL CSS -->
        <link href="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.css" rel="stylesheet" />

        <link href="https://unpkg.com/@maplibre/maplibre-gl-inspect@latest/dist/maplibre-gl-inspect.css" rel="stylesheet" />

        <link rel="stylesheet" href="css/output.css">
    
        <title>Indoor Map</title>
    </head>
    <body>
        <div id="map-container"></div>

        <div id="overlay-container">
            <header id="top-bar">
                <h1>🏫 EvaSchulze Plan</h1>
                <input type="text" id="search-box" name="search-box" placeholder="Raum, Gebäude, Inventar, IT-Infrastruktur suchen...">
                <select name="role-select" id="role-select"></select>
            </header>
            <div id="building-selector" class="panel horizontal"></div>
            <div id="floor-selector" class="panel vertical"></div>
            <div id="map-controls" class="panel vertical">
                <button class="panel-option" id="locate-btn" title="Meine Standort">📍</button>
                <button class="panel-option" id="zoom-in-btn" title="Vergrößern">➕</button>
                <button class="panel-option" id="zoom-out-btn" title="Verkleinern">➖</button>
                <button class="panel-option" id="reset-view-btn" title="Ansicht zurücksetzen">🔄</button>
            </div>
        </div>
    
        <script type="module" src="js/main.js"></script>
    </body>
</html>
