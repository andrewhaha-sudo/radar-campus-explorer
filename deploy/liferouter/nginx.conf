limit_req_zone $binary_remote_addr zone=routing:10m rate=5r/s;
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  location /api/liferouter/ {
    limit_req zone=routing burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 4k;
    proxy_pass http://router:8091;
    proxy_read_timeout 15s;
  }
  location /api/ {
    default_type application/json;
    return 503 '{"error":"Shared Facilities APIs require the Cloudflare platform deployment."}';
  }
  # This optional image is the campus simulation, not the Cloudflare backend.
  location ~ ^/(dashboard|campus-workspace|documents|scans|login|admin)(/|$) {
    default_type text/plain;
    return 503 "Shared Facilities requires the Cloudflare platform deployment.\n";
  }
  location = /campus/ { rewrite ^ /index.html last; }
  location / { try_files $uri $uri/ /index.html; }
}
